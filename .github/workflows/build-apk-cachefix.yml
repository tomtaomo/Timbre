name: Build APK (cache fix)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: cachefix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build_setup

      # 打包前自动修改缓存下载逻辑（只改工作区，不提交回仓库）：
      # 缓存请求带上源脚本要求的请求头（Referer / UA / Cookie），并和播放器一样带 Range
      - name: Patch the cache downloader
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          TARGET = "core/online/src/main/kotlin/voice/core/online/OnlineBookCacheManager.kt"

          path = pathlib.Path(TARGET)
          source = path.read_text(encoding="utf-8")
          origin = source


          def join(*lines):
              return "\n".join(lines)


          def rep(old, new):
              global source
              count = source.count(old)
              if count != 1:
                  sys.exit(
                      "anchor matched %d times, expected 1. first line: %r"
                      % (count, old.splitlines()[0][:90])
                  )
              source = source.replace(old, new)


          rep(
              join(
                  '        val downloaded = downloadSlots.withPermit { downloadToCache(ref, stream.url) }',
              ),
              join(
                  '        val downloaded = downloadSlots.withPermit { downloadToCache(ref, stream) }',
              ),
          )

          rep(
              join(
                  '  private suspend fun downloadToCache(',
                  '    ref: OnlineChapterRef,',
                  '    url: String,',
                  '  ): Boolean = withContext(Dispatchers.IO) {',
              ),
              join(
                  '  private suspend fun downloadToCache(',
                  '    ref: OnlineChapterRef,',
                  '    stream: ResolvedStream,',
                  '  ): Boolean = withContext(Dispatchers.IO) {',
              ),
          )

          rep(
              join(
                  '      val requestUrl = OnlineStreamUrlPolicy.applyCertFallback(url)',
                  '      download(requestUrl).use { response ->',
              ),
              join(
                  '      val requestUrl = OnlineStreamUrlPolicy.applyCertFallback(stream.url)',
                  '      download(requestUrl, stream.headers).use { response ->',
              ),
          )

          rep(
              join(
                  '  private suspend fun download(url: String): Response {',
                  '    return try {',
                  '      executeCancellable(downloadRequest(url))',
              ),
              join(
                  '  private suspend fun download(',
                  '    url: String,',
                  '    headers: Map<String, String>,',
                  '  ): Response {',
                  '    return try {',
                  '      executeCancellable(downloadRequest(url, headers))',
              ),
          )

          rep(
              join(
                  '      executeCancellable(downloadRequest(httpUrl))',
              ),
              join(
                  '      executeCancellable(downloadRequest(httpUrl, headers))',
              ),
          )

          rep(
              join(
                  '  private suspend fun downloadRequest(url: String): Request {',
              ),
              join(
                  '  private suspend fun downloadRequest(',
                  '    url: String,',
                  '    headers: Map<String, String>,',
                  '  ): Request {',
              ),
          )

          rep(
              join(
                  '    if (token.isNotEmpty() && base.isNotEmpty() && url.startsWith(base)) {',
                  '      builder.header("Authorization", "Bearer $token")',
                  '    }',
                  '    return builder.build()',
              ),
              join(
                  '    if (token.isNotEmpty() && base.isNotEmpty() && url.startsWith(base)) {',
                  '      builder.header("Authorization", "Bearer $token")',
                  '    }',
                  '    // headers the source script asked for (Referer / UA / Cookie): the player sends them, the cache must too',
                  '    for ((name, value) in headers) {',
                  '      builder.header(name, value)',
                  '    }',
                  '    builder.header("Range", "bytes=0-")',
                  '    return builder.build()',
              ),
          )

          if source == origin:
              sys.exit("nothing changed")

          path.write_text(source, encoding="utf-8")
          print("cache downloader patched")
          PY

      - name: Prepare signing key
        run: |
          set -e
          mkdir -p signing
          if [ -f signing/signing.b64 ]; then
            base64 -d signing/signing.b64 > signing/signing.keystore
            echo "使用仓库里已有的签名钥匙"
          else
            keytool -genkeypair -keystore signing/signing.keystore -storetype PKCS12 \
              -alias timbre -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass timbremod2026 -keypass timbremod2026 -dname "CN=Timbre Mod"
            base64 -w0 signing/signing.keystore > signing/signing.b64
            echo "已生成新的签名钥匙"
          fi
          printf 'STORE_PASSWORD=timbremod2026\nKEY_ALIAS=timbre\nKEY_PASSWORD=timbremod2026\n' > signing/signing.properties

      - name: Assemble signed release APK
        run: ./gradlew :app:assembleFreeRelease -Pvoice.versionName=3.6.3 -Pvoice.versionCode=637 -Pvoice.applicationId=app.timbre.audiobook.mod

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/free/release/*.apk out/
          ls -lh out
          for f in out/*.apk; do
            case "$f" in
              *unsigned*)
                echo "::error::出来的是未签名包，说明 signing.properties 没被读到"
                exit 1
                ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        with:
          name: timbre-cachefix-apk
          path: out/*.apk
          if-no-files-found: warn
