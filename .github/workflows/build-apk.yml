name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Build debug APK
        run: ./gradlew :app:assembleFreeDebug -Pvoice.versionName=3.6.3 -Pvoice.versionCode=637 -Pvoice.applicationId=app.timbre.audiobook.mod
      - uses: actions/upload-artifact@v6
        with:
          name: timbre-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
